services:
  postgres:

    image: postgres:17

    container_name: auth-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  memcached:
    image: memcached:1.6-alpine
    container_name: auth-memcached
    restart: unless-stopped
    ports:
      - "11211:11211"

volumes:
  postgres-data: